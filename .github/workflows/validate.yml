name: Validate Python project

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m py_compile bot.py
      - name: Validate deployment files
        run: python -c "import json; json.load(open('railway.json', encoding='utf-8'))"
